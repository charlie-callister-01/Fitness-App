<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fitness App</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <!-- The browser chrome colour (Keep dark until theme.js changes it). Before the script, which sets its content at first paint. -->
    <meta name="theme-color" content="#4A4237" />
    <!-- Applies the mirrored Theme and Mode before first paint (no flash); also the Blazor interop's entry point. Keep it first and synchronous. -->
    <script src="js/theme.js"></script>
    <link href="_content/Ui/tokens.css" rel="stylesheet" />
    <link href="_content/Ui/components.css" rel="stylesheet" />
    <link href="_content/Ui/ui.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fitness" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script type="importmap"></script>
    <script>
        // Restores the deep link path that 404.html encoded as /repo/?/path (GitHub Pages refresh fix).
        // The encoding half is deploy/404.template.html: keep the two in sync.
        (function (l) {
            if (l.search[1] === '/') {
                const decoded = l.search.slice(1).split('&').map(s => s.replace(/~and~/g, '&')).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
