<rect x="430" y="278.0" width="370" height="58" rx="10" fill="#FBEFF5" stroke="#A8336E" stroke-width="2"/>
<text x="442" y="298.0" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">The draft avoids back-to-back Sessions for</text>
<text x="442" y="315.0" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">the same muscle group.</text>
<path d="M384 499.0 H426" stroke="#A8336E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="430" y="461.5" width="370" height="75" rx="10" fill="#FBEFF5" stroke="#A8336E" stroke-width="2"/>
<text x="442" y="481.5" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Cancel keeps the old week; outstanding</text>
