<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580" role="img" aria-label="F-06 Export for an LLM: 5 steps" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="820" height="580" fill="#F4F5F7"/>
<text x="24" y="38" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="22" font-weight="800" fill="#15181B">F-06 · Export for an LLM</text>
<text x="24" y="60" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#535C66">Steps on the left (screen · action). Edge cases on the right.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#535C66"/></marker></defs>
<rect x="24" y="80" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#7D8590" stroke-width="2"/>
<rect x="24" y="80" width="58" height="70" rx="10" fill="#15181B"/><rect x="64" y="80" width="18" height="70" fill="#15181B"/>
<text x="53" y="110" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#F2B705">1</text><text x="53" y="130" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">S-09</text>
<text x="94" y="102" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Weekly review › Export for the LLM (one</text>
<text x="94" y="119" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">tap, preset to the past week).</text>
<path d="M204.0 150 V174" stroke="#535C66" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="176" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#7D8590" stroke-width="2"/>
<rect x="24" y="176" width="58" height="70" rx="10" fill="#15181B"/><rect x="64" y="176" width="18" height="70" fill="#15181B"/>
<text x="53" y="206" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#F2B705">2</text><text x="53" y="226" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">S-10</text>
<text x="94" y="198" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Picker opens prefilled: last 7 days;</text>
<text x="94" y="215" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Workouts, Plan ticked; health data</text>
<text x="94" y="232" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">(weight, pain) ticked off by default.</text>
<path d="M204.0 246 V270" stroke="#535C66" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="272" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#7D8590" stroke-width="2"/>
<rect x="24" y="272" width="58" height="70" rx="10" fill="#15181B"/><rect x="64" y="272" width="18" height="70" fill="#15181B"/>
<text x="53" y="302" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#F2B705">3</text><text x="53" y="322" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">S-10</text>
<text x="94" y="294" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Format: Markdown (readable) / JSON</text>
<text x="94" y="311" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">(canonical).</text>
<path d="M204.0 342 V366" stroke="#535C66" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="368" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#7D8590" stroke-width="2"/>
<rect x="24" y="368" width="58" height="70" rx="10" fill="#15181B"/><rect x="64" y="368" width="18" height="70" fill="#15181B"/>
<text x="53" y="398" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#F2B705">4</text><text x="53" y="418" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">S-10</text>
<text x="94" y="390" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Deliver: Copy to clipboard / Download</text>
<text x="94" y="407" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">file / Share sheet.</text>
<path d="M204.0 438 V462" stroke="#535C66" stroke-width="2" marker-end="url(#a)"/>
<rect x="24" y="464" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#7D8590" stroke-width="2"/>
<rect x="24" y="464" width="58" height="70" rx="10" fill="#15181B"/><rect x="64" y="464" width="18" height="70" fill="#15181B"/>
<text x="53" y="494" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#F2B705">5</text><text x="53" y="514" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">S-10</text>
<text x="94" y="486" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Confirmation: 'Copied. Health data left</text>
<text x="94" y="503" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">out.'</text>
<path d="M384 211.0 H426" stroke="#A8336E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="430" y="182.0" width="370" height="58" rx="10" fill="#FBEFF5" stroke="#A8336E" stroke-width="2"/>
<text x="442" y="202.0" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Full picker path: More › Export, default</text>
<text x="442" y="219.0" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">range 12 weeks, Guides off by default.</text>
<path d="M384 403.0 H426" stroke="#A8336E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="430" y="382.5" width="370" height="41" rx="10" fill="#FBEFF5" stroke="#A8336E" stroke-width="2"/>
<text x="442" y="402.5" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Export everything = Backup (all data, JSON).</text>
