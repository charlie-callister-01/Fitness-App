<text x="94" y="678" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Prompt: Make this the active Plan? ›</text>
<text x="94" y="695" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#15181B">Yes.</text>
