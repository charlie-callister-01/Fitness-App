/* Fitness App components: plain CSS on top of tokens.css.
   Theme = data-theme="keep|clean", Mode = data-mode="dark|light" on <html>. */

/* Per-Theme font and radius switches live in tokens.css. */

body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
.fa-root { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); max-width: 390px; }

/* Display text */
.fa-title { font-family: var(--font-display); font-weight: var(--w-display); color: var(--text-heading); text-shadow: var(--shadow-heading); margin: 0; }
.fa-title--xl { font-size: calc(32px * var(--display-scale)); line-height: calc(36px * var(--display-scale)); }
.fa-title--l { font-size: calc(26px * var(--display-scale)); line-height: calc(30px * var(--display-scale)); }
.fa-title--m { font-size: calc(20px * var(--display-scale)); line-height: calc(24px * var(--display-scale)); }
.fa-label { font-family: var(--font-label); font-size: calc(14px * var(--display-scale)); line-height: calc(18px * var(--display-scale)); font-weight: var(--w-label); color: var(--text-label); }
.fa-muted { color: var(--text-muted); font-size: 14px; line-height: 20px; }

/* Panels and wells */
.fa-panel { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-panel); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.fa-well { background: var(--surface-sunken); border-radius: var(--r-control); box-shadow: var(--shadow-sunken); padding: 10px 12px; }

/* Buttons (C-01) */
.fa-btn { min-height: var(--tap-min); padding: 0 var(--space-4); border: 0; border-radius: var(--r-control); font-family: var(--font-label); font-size: calc(16px * var(--display-scale)); font-weight: var(--w-label); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
.fa-btn--primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-primary); min-height: var(--tap-primary); font-size: calc(19px * var(--display-scale)); }
.fa-btn--secondary { background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-raised); }
[data-theme="keep"] .fa-btn--secondary { color: var(--text-heading); }
.fa-btn--icon { width: var(--tap-min); padding: 0; background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-raised); }
.fa-btn--stepper { min-height: var(--tap-primary); min-width: 60px; padding: 0; background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-raised); font-size: 20px; }
.fa-btn:focus-visible, .fa-input:focus-visible, .fa-rpe button:focus-visible, .fa-tab:focus-visible, .fa-tile:focus-visible { outline: var(--border-thick) solid var(--focus); outline-offset: 2px; }
.fa-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.fa-btn:active:not(:disabled) { transform: translateY(1px); }
@media (prefers-reduced-motion: reduce) { .fa-btn:active:not(:disabled) { transform: none; } }

/* Set row (C-02) */
.fa-setrow { display: grid; grid-template-columns: 24px 1fr 14px 1fr var(--tap-log); gap: var(--space-2); align-items: center; }
.fa-setrow__n { font-family: var(--font-label); font-weight: var(--w-label); font-size: calc(16px * var(--display-scale)); color: var(--text-muted); }
.fa-setrow--done .fa-setrow__n { color: var(--done-text); }
.fa-setrow--current .fa-setrow__n { color: var(--focus); }
.fa-setrow--upcoming { opacity: var(--opacity-upcoming); }
.fa-setrow__x { text-align: center; color: var(--text-muted); }
.fa-input { height: var(--tap-log); width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--input-text); border: var(--border-thin) solid var(--input-border); border-radius: var(--r-control); font-family: var(--font-system); font-size: 24px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.fa-input--pending { color: var(--input-pending); }
.fa-input--current { border: var(--border-thick) solid var(--focus); }
.fa-input--error { border: var(--border-thick) solid var(--pr); }
.fa-setrow__state { height: var(--tap-log); display: flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-control); }
.fa-setrow__state--done { background: var(--done); color: var(--on-done); box-shadow: var(--shadow-raised); }
.fa-setrow__error { grid-column: 2 / -1; font-size: 13px; color: var(--text); display: flex; gap: var(--space-1); align-items: center; }
.fa-colheads { display: grid; grid-template-columns: 24px 1fr 14px 1fr var(--tap-log); gap: var(--space-2); font-family: var(--font-label); font-size: calc(12px * var(--display-scale)); color: var(--text-muted); text-align: center; }

/* PR marker (C-03) */
.fa-pr { height: var(--tap-log); display: flex; align-items: center; justify-content: center; }
.fa-pr__shield { fill: var(--pr); stroke: var(--outline); }
.fa-pr__trim { fill: none; stroke: var(--art-ochre); }
.fa-pr__text { fill: var(--on-pr); font-family: var(--font-pixel); font-weight: 400; }
[data-theme="clean"] .fa-pr { background: var(--pr); color: var(--on-pr); border-radius: var(--r-control); font-weight: 800; font-size: 15px; }
[data-theme="clean"] .fa-pr svg { display: none; }
[data-theme="keep"] .fa-pr__clean { display: none; }

/* Exercise header + Suggested target (C-04) */
.fa-exercise__top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.fa-exercise__name { padding: 0; border: 0; background: none; text-align: left; cursor: pointer; font-family: var(--font-display); font-weight: var(--w-display); font-size: calc(25px * var(--display-scale)); line-height: calc(30px * var(--display-scale)); color: var(--text-label); }
[data-theme="clean"] .fa-exercise__name { color: var(--text); }
.fa-exercise__lastbest { color: var(--done-text); font-family: var(--font-label); font-size: calc(14px * var(--display-scale)); }
[data-theme="clean"] .fa-exercise__lastbest { color: var(--text-muted); }
.fa-target { font-size: 14px; line-height: 20px; color: var(--text); }
.fa-target b { color: var(--text-heading); }
[data-theme="clean"] .fa-target b { color: var(--text); }

/* RPE selector (C-05) */
.fa-rpe { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.fa-rpe__opts { display: flex; gap: var(--space-1); }
.fa-rpe button { width: var(--tap-min); height: var(--tap-min); border: 0; border-radius: var(--r-control); background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-raised); font-family: var(--font-label); font-size: calc(15px * var(--display-scale)); font-weight: var(--w-label); }
.fa-rpe button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* Confirm bar (C-06) */
.fa-confirmbar { background: var(--surface); box-shadow: var(--shadow-sheet); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px var(--space-3) 18px; display: flex; flex-direction: column; gap: 10px; }
.fa-confirmbar__info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
.fa-confirmbar__info b { color: var(--text-label); font-weight: 700; }
[data-theme="clean"] .fa-confirmbar__info b { color: var(--text); }
.fa-confirmbar__row { display: grid; grid-template-columns: 60px 1fr 60px; gap: 10px; }

/* State chips (C-07) */
.fa-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.fa-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border: var(--border-thin) solid currentColor; border-radius: var(--r-control); font-family: var(--font-label); font-size: calc(13px * var(--display-scale)); font-weight: var(--w-label); background: var(--surface); }
.fa-chip--pr { color: var(--pr-text); } .fa-chip--done { color: var(--done-text); } .fa-chip--partial { color: var(--state-partial); } .fa-chip--skipped { color: var(--state-skipped); } .fa-chip--swapped { color: var(--state-swapped); } .fa-chip--missed { color: var(--state-missed); border-style: dashed; } .fa-chip--pain { color: var(--state-pain); }

/* Nudge (C-08) */
.fa-nudge { background: var(--nudge-bg); color: var(--nudge-text); border-radius: var(--r-card); box-shadow: var(--shadow-panel); padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font-size: 14px; line-height: 20px; }
.fa-nudge__lead { color: var(--nudge-label); font-weight: 700; }
.fa-nudge__actions { display: flex; gap: var(--space-1); flex-shrink: 0; }
.fa-nudge .fa-btn { min-height: 36px; padding: 0 10px; font-size: 13px; }
.fa-nudge__dismiss { width: var(--tap-min); min-height: var(--tap-min); background: none; border: 0; color: var(--nudge-text); }

/* Today's Workout card (C-09) */
.fa-today { position: relative; overflow: hidden; }
.fa-today__band { position: absolute; left: 0; top: 0; width: 100%; height: 10px; }
[data-theme="clean"] .fa-today__band { display: none; }
.fa-today__band rect { fill: var(--art-ink); } .fa-today__band polyline { stroke: var(--art-vermilion); }
.fa-today__alt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Badge tile (C-10) */
.fa-badgegrid { background: var(--surface); box-shadow: var(--shadow-panel); border-radius: var(--r-card); padding: var(--space-2); display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.fa-tile { height: 74px; box-sizing: border-box; padding: 6px 8px; display: flex; flex-direction: column; justify-content: space-between; border: 0; border-radius: var(--r-control); background: var(--surface-sunken); box-shadow: var(--shadow-sunken); color: var(--text); font-family: var(--font-label); text-align: left; cursor: pointer; }
.fa-tile__top { display: flex; justify-content: space-between; align-items: center; }
.fa-tile__v { font-size: calc(16px * var(--display-scale)); font-weight: var(--w-label); color: var(--text-heading); font-variant-numeric: tabular-nums; }
.fa-tile__n { font-size: calc(11px * var(--display-scale)); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fa-tile--locked .fa-tile__art { opacity: var(--opacity-locked); }
.fa-tile--locked .fa-tile__v { color: var(--text-muted); }
.fa-tile--unlocked { outline: var(--border-thin) solid var(--done-text); outline-offset: -2px; }

/* Status orb (C-11) */
.fa-orb { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.fa-orb__ring { fill: var(--art-ink); stroke: var(--orb-ring); }
.fa-orb__track { fill: none; stroke: var(--orb-track); }
.fa-orb__fill--green { stroke: var(--done); } .fa-orb__fill--red { stroke: var(--pr); } .fa-orb__fill--ochre { stroke: var(--art-ochre); }
.fa-orb__value { fill: var(--text-heading); font-family: var(--font-label); font-weight: var(--w-label); }
[data-theme="clean"] .fa-orb__ring { fill: var(--surface); }
[data-mode="light"] .fa-orb__ring { fill: var(--surface); }
.fa-orb__cap { font-family: var(--font-label); font-size: calc(12px * var(--display-scale)); color: var(--text-muted); }

/* Tab bar (C-12) */
.fa-tabbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 8px 14px; background: var(--surface); box-shadow: var(--shadow-sheet); }
.fa-tab { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--r-control); background: var(--surface-raised); box-shadow: var(--shadow-raised); color: var(--text-muted); text-decoration: none; font-family: var(--font-label); font-size: calc(11px * var(--display-scale)); }
[data-theme="clean"] .fa-tab { background: transparent; }
.fa-tab[aria-current="page"] { background: var(--tab-active); color: var(--on-tab-active); }

/* Keep the display face free of ligatures and contextual swaps so labels read letter by letter. */
.fa-title, .fa-label, .fa-btn, .fa-exercise__name, .fa-tile, .fa-chip, .fa-tab { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0, "calt" 0; }
.fa-setrow__error[hidden] { display: none; }

/* prototype-only layout */
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent}
[data-theme="keep"] body{background-image:var(--tex);background-repeat:repeat}
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--surface);box-shadow:0 3px 0 var(--outline)}
[data-theme="clean"] .top{background:transparent;box-shadow:none}
.top__mid{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.top__title{font-family:var(--font-display);font-weight:var(--w-display);font-size:calc(20px * var(--display-scale));line-height:calc(24px * var(--display-scale));color:var(--text-heading);text-shadow:var(--shadow-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.top__sub{font-family:var(--font-label);font-size:calc(13px * var(--display-scale));color:var(--text-label);font-variant-numeric:tabular-nums}
[data-theme="clean"] .top__sub{color:var(--text-muted)}
.banner{margin:8px 12px 0;padding:6px 10px;font-size:13px;background:var(--surface-sunken);box-shadow:var(--shadow-sunken);border-radius:var(--r-control);display:flex;gap:6px;align-items:center;color:var(--text)}
.pager{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.pager button{flex:0 0 auto;min-width:44px;height:36px;padding:0 8px;border:0;border-radius:var(--r-control);background:var(--surface-sunken);box-shadow:var(--shadow-sunken);color:var(--text-muted);font-family:var(--font-label);font-size:calc(13px * var(--display-scale));font-weight:var(--w-label);display:flex;align-items:center;gap:4px}
.pager button[aria-current="step"]{background:var(--surface-raised);box-shadow:var(--shadow-raised);color:var(--text-heading);outline:2px solid var(--focus);outline-offset:-2px}
.pager .ok{color:var(--done-text)} .pager .sk{color:var(--state-skipped)} .pager .sw{color:var(--state-swapped)}
.scroll{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px}
.why{font-size:13px;color:var(--text-muted);display:flex;gap:6px;align-items:flex-start}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-label);font-size:calc(12px * var(--display-scale));font-weight:var(--w-label);padding:2px 6px;border:2px solid currentColor;border-radius:var(--r-control)}
.sets{display:flex;flex-direction:column;gap:9px}
.wide{grid-column:2 / 5}
.bwtag{height:var(--tap-log);display:flex;align-items:center;justify-content:center;font-family:var(--font-label);font-weight:700;color:var(--text-muted);background:var(--surface-sunken);border-radius:var(--r-control);box-shadow:var(--shadow-sunken)}
.pace{grid-column:2 / -1;font-size:12px;color:var(--text-muted);margin-top:-4px}
.maxflag{grid-column:2 / -1;margin-top:-4px;font-size:calc(12px * var(--display-scale));color:var(--pr-text);font-family:var(--font-label);font-weight:var(--w-label)}
.rowtools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.linkbtn{min-height:44px;padding:0 6px;border:0;background:none;color:var(--text-muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.skipped-card{padding:14px;border-radius:var(--r-card);background:var(--surface-sunken);box-shadow:var(--shadow-sunken);display:flex;flex-direction:column;gap:8px}
.timerchip{font-variant-numeric:tabular-nums}
.timerchip.on{color:var(--text-heading);font-weight:700}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);box-shadow:var(--shadow-panel);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:16px 14px 22px;display:flex;flex-direction:column;gap:12px;z-index:21}
.sheet h2{margin:0}
.opt{min-height:52px;width:100%;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;border-radius:var(--r-control);background:var(--surface-raised);box-shadow:var(--shadow-raised);color:var(--text);font:inherit;font-size:16px;text-align:left}
.opt svg{flex:0 0 auto;color:var(--text-label)}
[data-theme="clean"] .opt svg{color:var(--text-muted)}
.opt small{display:block;color:var(--text-muted);font-size:13px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:44px;padding:0 14px;border:var(--border-thin) solid var(--input-border);border-radius:var(--r-control);background:var(--surface-sunken);color:var(--text);font:inherit;font-size:15px;font-weight:600}
[data-theme="keep"][data-mode="dark"] .pick{border-color:var(--bevel-light)}
.pick[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text-muted)}
.field textarea,.field select{min-height:48px;padding:10px;font:inherit;font-size:16px;color:var(--input-text);background:var(--input-bg);border:var(--border-thin) solid var(--input-border);border-radius:var(--r-control)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* summary */
.sum{display:flex;flex-direction:column;gap:12px;padding:16px 12px 24px;overflow-y:auto;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:10px;border-radius:var(--r-control);background:var(--surface-sunken);box-shadow:var(--shadow-sunken);text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--text-heading)}
.stat span{font-size:12px;color:var(--text-muted)}
.list{display:flex;flex-direction:column;gap:6px;font-size:15px}
.list li{display:flex;justify-content:space-between;gap:8px}
.toast{pointer-events:none;position:absolute;left:12px;right:12px;top:12px;z-index:30;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--surface);box-shadow:var(--shadow-panel);border-radius:var(--r-card);opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hint{font-size:12px;color:var(--text-muted);text-align:center}
.fa-setrow__error[hidden]{display:none}
:root{font-variant-ligatures:no-common-ligatures}
.fa-title,.fa-label,.fa-btn,.fa-exercise__name,.top__title,.top__sub,.pager button,.fa-tile,.fa-chip{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"calt" 0}
.toast{top:auto;bottom:150px}

.fa-prsvg text{font-family:var(--font-pixel)}
</style>

dth=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M10 22 H14 L13.5 14 H10.5 Z\"/><path d=\"M12 2 C16 7 17 9 17 11 A5 5 0 0 1 7 11 C7 9 8 7 12 2 Z\"/></svg>", "swap": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M4 8 H18 M14 4 L18 8 L14 12\"/><path d=\"M20 16 H6 M10 12 L6 16 L10 20\"/></svg>", "timer": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M7 3 H17 M7 21 H17 M8 3 C8 9 16 9 16 12 C16 15 8 15 8 21 M16 3 C16 9 8 9 8 12 C8 15 16 15 16 21\"/></svg>", "trophies": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M12 2 L20 5 V12 C20 17 16 20 12 22 C8 20 4 17 4 12 V5 Z\"/><path d=\"M12 8 L13.4 11 L16.5 11.3 L14.2 13.4 L14.8 16.5 L12 15 L9.2 16.5 L9.8 13.4 L7.5 11.3 L10.6 11 Z\" fill=\"currentColor\" stroke=\"none\"/></svg>", "undo": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M9 14 L4 9 L9 4\"/><path d=\"M4 9 H14 A6 6 0 0 1 14 21 H9\"/></svg>", "video": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\"/><path d=\"M16 10 L21 7 V17 L16 14\"/></svg>", "warning": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M12 3 L22 20 H2 Z M12 10 V14 M12 17 V18\"/></svg>", "week": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\"/><path d=\"M3 10 H21 M8 3 V7 M16 3 V7\"/></svg>", "weight": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M12 3 V20 M5 6 H19 M8 20 H16\"/><path d=\"M2 14 L5 6 L8 14 Z M16 14 L19 6 L22 14 Z\"/></svg>"};window.__PRMARK__="<div class=\"fa-pr\" role=\"img\" aria-label=\"PR\"><svg class=\"fa-prsvg\" xmlns=\"http://www.w3.org/2000/svg\" width=\"54\" height=\"56\" viewBox=\"0 0 54 56\" aria-hidden=\"true\">\n\n<path d=\"M27 2 L51 10 L51 30 C51 44 40 52 27 55 C14 52 3 44 3 30 L3 10 Z\" fill=\"#C93E23\" stroke=\"#141210\" stroke-width=\"2.5\"/>\n<path d=\"M27 8 L45 14 L45 30 C45 40 37 46 27 49 C17 46 9 40 9 30 L9 14 Z\" fill=\"none\" stroke=\"#E8A33A\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\n<text x=\"27\" y=\"35\" text-anchor=\"middle\" font-family=\"'Jersey 15', ui-monospace, monospace\" font-size=\"18\" fill=\"#FFFFFF\">PR</text>\n</svg><span class=\"fa-pr__clean\">PR!</span></div>";window.__BADGE__="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"48\" height=\"56\" viewBox=\"0 0 96 112\" role=\"img\" aria-label=\"10 PRs\">\n<path d=\"M48 3 L91 17 L91 56 C91 83 71 100 48 109 C25 100 5 83 5 56 L5 17 Z\" fill=\"#141210\" stroke=\"#D9472B\" stroke-width=\"4 <script>
/* Fitness App — Workout log prototype. Plain JS, no build step. Sample data only. */
(function () {
  'use strict';
  var IC = window.__ICONS__ || {};
  var PRMARK = window.__PRMARK__ || '<span class="fa-pr">PR!</span>';
  function icon(n) { return IC[n] || ''; }
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: prototype still works */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /* ---------- time helpers ---------- */
  function parseTime(s) { // "m:ss" or "ss" -> seconds, NaN if bad
    s = String(s).trim(); if (!s) return NaN;
    var m = /^(\d{1,3}):([0-5]\d)$/.exec(s); if (m) return (+m[1]) * 60 + (+m[2]);
    if (/^\d+$/.test(s)) return +s; return NaN;
  }
  function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  function num(s) { s = String(s).replace(',', '.').trim(); return /^\d+(\.\d+)?$/.test(s) ? parseFloat(s) : NaN; }

  /* ---------- sample Session A ---------- */
  var LIBRARY = [ // Exercise library subset for Swap / Add, grouped by tags
    { id: 'goblet', name: 'Goblet squat', kind: 'wr', tags: ['legs', 'squat'] },
    { id: 'frontsq', name: 'Front squat', kind: 'wr', tags: ['legs', 'squat'] },
    { id: 'splitsq', name: 'Split squat', kind: 'wr', tags: ['legs', 'squat'] },
    { id: 'boxsq', name: 'Box squat', kind: 'wr', tags: ['legs', 'squat'] },
    { id: 'pullup', name: 'Pull-up', kind: 'bw', tags: ['pull', 'back'] },
    { id: 'ringrow', name: 'Ring row', kind: 'bw', tags: ['pull', 'back'] },
    { id: 'latpd', name: 'Lat pulldown', kind: 'wr', tags: ['pull', 'back'] },
    { id: 'carry', name: "Farmer's carry", kind: 'carry', tags: ['carry', 'grip', 'hyrox'] },
    { id: 'suitcase', name: 'Suitcase carry', kind: 'carry', tags: ['carry', 'grip', 'core'] },
    { id: 'plank', name: 'Plank', kind: 'sec', tags: ['core'] },
    { id: 'deadbug', name: 'Dead bug', kind: 'reps', tags: ['core'] },
    { id: 'row500', name: 'Rowing 500 m', kind: 'time', tags: ['cardio', 'hyrox'] },
    { id: 'ski500', name: 'SkiErg 500 m', kind: 'time', tags: ['cardio', 'hyrox'] },
    { id: 'run1k', name: 'Run intervals', kind: 'dt', tags: ['cardio', 'run'] },
    { id: 'wallball', name: 'Wall balls', kind: 'reps', tags: ['hyrox', 'legs'] },
    { id: 'mobility', name: 'Hip mobility flow', kind: 'tick', tags: ['mobility'] }
  ];
  function libById(id) { for (var i = 0; i < LIBRARY.length; i++) if (LIBRARY[i].id === id) return LIBRARY[i]; return null; }

  function freshSession() {
    return {
      name: 'A · Lower + core', code: 'A', startedAt: Date.now(), afterwards: false, finished: false,
      ex: [
        { id: 'goblet', name: 'Goblet squat', kind: 'wr', plan: '4 × 8', cue: 'Brace, sit between the heels, drive the floor away.', inc: 2,
          best: { w: 22, r: 8 }, lastTxt: 'Last 20 × 10 · Best 22 × 8',
          target: { a: 22, b: 8, txt: 'Try 22 kg × 8', why: 'you hit 10 reps at 20 kg last time.' },
          sets: [[22, 8], [22, 8], [22, 8], [22, 8]] },
        { id: 'pullup', name: 'Pull-up', kind: 'bw', plan: '3 × 8', cue: 'Full hang, chest to bar, slow down.', inc: 1,
          best: { r: 8 }, lastTxt: 'Last 8, 8, 7 · Best 8',
          target: { b: 9, txt: 'Try 9 on Set 1', why: 'last week was 8, 8, 7 at RPE 7.' },
          sets: [[0, 9], [0, 8], [0, 8]] },
        { id: 'carry', name: "Farmer's carry", kind: 'carry', plan: '3 × 40 m', cue: 'Tall, tight, short quick steps.', inc: 2,
          best: { w: 24, d: 40 }, lastTxt: 'Last 24 kg/hand × 40 m · Best 24 × 40',
          target: { a: 26, b: 40, txt: 'Try 26 kg/hand × 40 m', why: '40 m at 24 kg felt easy (RPE 6).' },
          sets: [[26, 40], [26, 40], [26, 40]] },
        { id: 'plank', name: 'Plank', kind: 'sec', plan: '3 × 45 s', cue: 'Squeeze glutes, ribs down.', inc: 5,
          best: { s: 50 }, lastTxt: 'Last 45, 45, 40 s · Best 50 s',
          target: { a: 45, txt: 'Hold 45 s', why: 'same as last time; aim to finish all three.' },
          sets: [[45], [45], [45]] },
        { id: 'row500', name: 'Rowing 500 m', kind: 'time', plan: '1 × 500 m, all out', cue: 'Legs, body, arms. Rate 28–32.', inc: 0, benchmark: true,
          best: { t: 108 }, lastTxt: 'Last 1:52 · Best 1:48',
          target: { a: 107, txt: 'Aim for 1:47', why: 'best is 1:48 and you rowed 3 times since.' },
          sets: [['1:50']] },
        { id: 'run1k', name: 'Run intervals', kind: 'dt', plan: '3 × 1 km, 90 s rest', cue: 'Even pace; last rep fastest.', inc: 0,
          best: { pace: 265 }, lastTxt: 'Last 4:40 /km · Best 4:25 /km',
          target: { txt: 'Hold 4:35 /km', why: 'last week averaged 4:40 at RPE 7.' },
          sets: [[1, '4:35'], [1, '4:35'], [1, '4:35']] }
      ].map(function (e) {
        e.status = 'todo'; e.rpe = null; e.swappedFrom = null; e.skipReason = null;
        e.sets = e.sets.map(function (s) { return { a: s[0], b: s[1], done: false, max: false }; });
        return e;
      }),
      cur: 0, rest: { on: false, len: 90, endsAt: 0 }, pain: null
    };
  }

  /* ---------- state ---------- */
  var S = store.get('fa-proto-session');
  var resumed = !!(S && !S.finished);
  if (!resumed) S = freshSession();
  var UI = store.get('fa-proto-ui') || { theme: 'keep', mode: 'dark' };
  function save() { store.set('fa-proto-session', S); }
  function applyTheme() {
    var h = document.documentElement; h.setAttribute('data-theme', UI.theme); h.setAttribute('data-mode', UI.mode);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', getComputedStyle(h).getPropertyValue('--surface').trim() || '#4A4237');
    store.set('fa-proto-ui', UI);
  }

  /* ---------- per-kind rules ---------- */
  var KIND = {
    wr: { heads: ['kg', 'reps'], a: { mode: 'decimal', label: 'weight kg' }, b: { mode: 'numeric', label: 'reps' } },
    bw: { heads: ['', 'reps'], a: null, b: { mode: 'numeric', label: 'reps' } },
    carry: { heads: ['kg/hand', 'm'], a: { mode: 'decimal', label: 'weight kg per hand' }, b: { mode: 'numeric', label: 'metres' } },
    sec: { heads: ['seconds', ''], wide: { mode: 'numeric', label: 'seconds' } },
    reps: { heads: ['reps', ''], wide: { mode: 'numeric', label: 'reps' } },
    time: { heads: ['time (m:ss)', ''], wide: { mode: 'text', label: 'time minutes and seconds' } },
    dt: { heads: ['km', 'time'], a: { mode: 'decimal', label: 'distance km' }, b: { mode: 'text', label: 'time minutes and seconds' } },
    tick: { heads: ['', ''], tick: true }
  };
  function validate(e, s) { // returns error text or ''
    var k = e.kind;
    if (k === 'wr' || k === 'carry') { if (isNaN(num(s.a))) return 'Weight should be a number, like 22 or 22.5'; if (isNaN(num(s.b)) || num(s.b) % 1) return (k === 'carry' ? 'Distance' : 'Reps') + ' should be a whole number'; }
    if (k === 'bw' || k === 'reps' || k === 'sec') { var v = k === 'bw' ? s.b : s.a; if (isNaN(num(v)) || num(v) % 1) return 'Use a whole number, like 8'; }
    if (k === 'time') { if (isNaN(parseTime(s.a))) return 'Use minutes and seconds, like 1:48'; }
    if (k === 'dt') { if (isNaN(num(s.a))) return 'Distance in km, like 1 or 0.4'; if (isNaN(parseTime(s.b))) return 'Use minutes and seconds, like 4:35'; }
    return '';
  }
  function isPR(e, s) { // strictly beats the best from before this Workout
    if (validate(e, s)) return false; var b = e.best || {};
    switch (e.kind) {
      case 'wr': var e1 = num(s.a) * (1 + num(s.b) / 30), b1 = b.w * (1 + b.r / 30); return e1 > b1 + 1e-9;
      case 'bw': return num(s.b) > b.r;
      case 'carry': return (num(s.a) > b.w && num(s.b) >= b.d) || (num(s.a) >= b.w && num(s.b) > b.d);
      case 'sec': return num(s.a) > b.s;
      case 'reps': return b.r != null && num(s.a) > b.r;
      case 'time': return parseTime(s.a) < b.t;
      case 'dt': return parseTime(s.b) / num(s.a) < b.pace;
      default: return false;
    }
  }
  function setText(e, s) {
    switch (e.kind) {
      case 'wr': return s.a + ' kg × ' + s.b; case 'bw': return s.b + ' reps'; case 'carry': return s.a + ' kg/hand × ' + s.b + ' m';
      case 'sec': return s.a + ' s'; case 'reps': return s.a + ' reps'; case 'time': return s.a;
      case 'dt': return s.a + ' km in ' + s.b + ' (' + fmtTime(parseTime(s.b) / num(s.a)) + ' /km)'; default: return 'done';
    }
  }
  function curSetIdx(e) { for (var i = 0; i < e.sets.length; i++) if (!e.sets[i].done) return i; return -1; }
  function exDone(e) { return e.status === 'skipped' || curSetIdx(e) === -1; }
  function doneCount() { return S.ex.filter(function (e) { return e.status !== 'skipped' && curSetIdx(e) === -1; }).length; }
  function prCount() { var n = 0; S.ex.forEach(function (e) { if (e.status !== 'skipped' && e.sets.some(function (s) { return s.done && isPR(e, s); })) n++; }); return n; }

  /* ---------- rendering ---------- */
  var app = $('#app');
  function render() {
    if (S.finished) return renderSummary();
    var e = S.ex[S.cur];
    var h = '';
    h += '<header class="top">' +
      '<button class="fa-btn fa-btn--icon" id="b-back" aria-label="Back to Home (Workout stays in progress)">' + icon('back') + '</button>' +
      '<div class="top__mid"><span class="top__title">' + esc(S.name) + '</span><span class="top__sub" id="hdr">' + hdrText() + '</span></div>' +
      '<button class="fa-btn fa-btn--icon" id="b-wmenu" aria-label="Workout menu: rest timer, theme, finish">' + icon('menu-more') + '</button>' +
      '</header>';
    if (resumed) h += '<div class="banner" role="status">' + icon('info') + '<span>Resumed where you left off.</span></div>';
    if (S.afterwards) h += '<div class="banner">' + icon('logged-afterwards') + '<span>Logged afterwards · Sun 15 Nov. No timers.</span></div>';
    h += '<nav class="pager" aria-label="Exercises">' + S.ex.map(function (x, i) {
      var cls = x.status === 'skipped' ? 'sk' : (exDone(x) ? 'ok' : (x.swappedFrom ? 'sw' : ''));
      var g = x.status === 'skipped' ? '—' : (exDone(x) ? '✓' : (x.swappedFrom ? '⇄' : ''));
      return '<button data-go="' + i + '"' + (i === S.cur ? ' aria-current="step"' : '') + ' aria-label="Exercise ' + (i + 1) + ': ' + esc(x.name) + (cls === 'ok' ? ', done' : cls === 'sk' ? ', skipped' : '') + '"><span class="' + cls + '">' + (i + 1) + '</span>' + (g ? '<span class="' + cls + '" aria-hidden="true">' + g + '</span>' : '') + '</button>';
    }).join('') + '</nav>';
    h += '<main class="scroll" id="main">' + renderExercise(e) + '</main>';
    h += renderBar(e);
    app.innerHTML = h + '<div class="scrim" id="scrim"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
    bindMain();
    resumed = false;
  }
  function hdrText() {
    var mins = Math.floor((Date.now() - S.startedAt) / 60000);
    var p = prCount();
    return doneCount() + ' of ' + S.ex.length + ' done' + (p ? ' · ' + p + ' PR' + (p > 1 ? 's' : '') : '') + (S.afterwards ? '' : ' · ' + mins + ' min');
  }
  function renderExercise(e) {
    var k = KIND[e.kind], h = '<section class="fa-panel" aria-labelledby="exname">';
    h += '<div class="fa-exercise__top"><button class="fa-exercise__name" id="exname" data-act="guide">' + esc(e.name) + '</button>' +
      '<button class="fa-btn fa-btn--icon" data-act="exmenu" aria-label="Exercise menu: swap, skip, add, benchmark, Guide">' + icon('menu-more') + '</button></div>';
    var tags = '';
    if (e.benchmark) tags += '<span class="tag" style="color:var(--session-test)">' + icon('benchmark') + ' Benchmark</span> ';
    if (e.swappedFrom) tags += '<span class="tag" style="color:var(--state-swapped)">⇄ Swapped · was ' + esc(e.swappedFrom) + '</span> ';
    if (e.added) tags += '<span class="tag" style="color:var(--text-muted)">+ Added</span>';
    if (tags) h += '<div style="display:flex;gap:6px;flex-wrap:wrap">' + tags + '</div>';
    h += '<div style="font-size:14px">' + esc(e.plan) + (e.cue ? ' · ' + esc(e.cue) : '') + '</div>';
    if (e.lastTxt) h += '<div class="fa-exercise__lastbest">' + esc(e.lastTxt) + '</div>';
    if (e.target) h += '<div class="fa-well fa-target"><b>' + esc(e.target.txt) + '</b> — ' + esc(e.target.why) + '</div>';
    h += '</section>';
    if (e.status === 'skipped') {

        if (b.dataset.sev) { sh.querySelectorAll('[data-sev]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); st.sev = b.dataset.sev; return; }
        if (b.dataset.p === 'no') S.pain = { answer: 'no' };
        else if (b.dataset.p === 'skip') S.pain = { answer: 'not answered' };
        else if (b.dataset.p === 'save') S.pain = { answer: 'yes', side: sh.querySelector('#painside').value, areas: st.area, severity: st.sev, exercise: sh.querySelector('#painex').value, note: sh.querySelector('#painnote').value };
        else return;
        S.finished = true; S.finishedAt = Date.now(); save(); closeSheet(); render();
      }, 'Pain check');
    var m = $('#painmore'); if (m) m.style.display = 'none';
  }

  /* ---------- summary ---------- */
  function renderSummary() {
    var mins = Math.max(1, Math.round(((S.finishedAt || Date.now()) - S.startedAt) / 60000));
    var sets = 0, prs = [];
    S.ex.forEach(function (e) {
      var best = null; e.sets.forEach(function (s) { if (s.done) { sets++; if (isPR(e, s)) best = s; } });
      if (best && e.status !== 'skipped') prs.push(e.name + ' ' + setText(e, best) + ' (was ' + (e.lastTxt.split('Best ')[1] || 'none') + ')');
    });
    var skipped = S.ex.filter(function (e) { return e.status === 'skipped'; });
    var swapped = S.ex.filter(function (e) { return e.swappedFrom; });
    var h = '<header class="top"><span></span><div class="top__mid"><span class="top__title">Workout done</span><span class="top__sub">Session ' + esc(S.name) + (S.partial ? ' · Partial' : '') + '</span></div><span style="width:44px"></span></header>';
    h += '<div class="sum">';
    h += '<div class="stats"><div class="stat"><b>' + (S.afterwards ? '—' : mins + 'm') + '</b><span>duration</span></div><div class="stat"><b>' + sets + '</b><span>Sets</span></div><div class="stat"><b>' + prs.length + '</b><span>PRs</span></div></div>';
    if (prs.length) h += '<section class="fa-panel"><span class="fa-label">PRs</span><ul class="list" style="margin:0;padding:0;list-style:none">' + prs.map(function (p) { return '<li><span><span class="fa-chip fa-chip--pr" style="min-height:24px">▲ PR</span> ' + esc(p) + '</span></li>'; }).join('') + '</ul></section>';
    h += '<section class="fa-panel"><span class="fa-label">Exercises</span><ul class="list" style="margin:0;padding:0;list-style:none">' + S.ex.map(function (e) {
      var st = e.status === 'skipped' ? '<span class="fa-chip fa-chip--skipped" style="min-height:24px">— Skipped</span>' : (e.swappedFrom ? '<span class="fa-chip fa-chip--swapped" style="min-height:24px">⇄ Swapped</span>' : '<span class="fa-chip fa-chip--done" style="min-height:24px">✓ Done</span>');
      return '<li><span>' + esc(e.name) + (e.rpe ? ' · RPE ' + e.rpe : '') + '</span>' + st + '</li>';
    }).join('') + '</ul></section>';
    h += '<section class="fa-panel"><span class="fa-label">Pain check</span><span style="font-size:15px">' + (S.pain ? (S.pain.answer === 'yes' ? 'Yes: ' + esc((S.pain.side ? S.pain.side + ' ' : '') + ((S.pain.areas || []).join(', ').toLowerCase() || 'area not given')) + (S.pain.severity ? ', ' + S.pain.severity.toLowerCase() : '') + (S.pain.exercise ? ' (during ' + esc(S.pain.exercise) + ')' : '') : S.pain.answer === 'no' ? 'No pain' : 'Not answered') : 'Not answered') + '</span></section>';
    h += '<div class="fa-well" style="font-size:14px">' + icon('streak') + ' Streak: 5 weeks. This week 1 of 3 Workouts toward the minimum.</div>';
    h += '<button class="fa-btn fa-btn--primary" data-s="new">Back to Home (start the sample again)</button>';
    h += '<p class="hint">Prototype · sample data · nothing leaves this device</p>';
    h += '</div>';
    app.innerHTML = h + '<div class="scrim" id="scrim"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>';
    app.onclick = function (ev) { var b = ev.target.closest('button'); if (b && b.dataset.s === 'new') { store.del('fa-proto-session'); S = freshSession(); render(); } };
    app.oninput = app.onkeydown = app.onfocusin = null;
    if (prs.length) setTimeout(function () { announce('', '<span style="flex:0 0 auto">' + (window.__BADGE__ || '') + '</span><span><span class="fa-label" style="display:block">Badge unlocked</span><span class="fa-title fa-title--m">10 PRs</span></span>'); }, 400);
  }

  /* ---------- ticker, wake lock, boot ---------- */
  setInterval(function () {
    if (S.finished) return;
    var hd = document.getElementById('hdr'); if (hd) hd.textContent = hdrText();
    var rc = document.getElementById('restchip'); if (rc && S.rest.on) rc.textContent = 'Rest ' + (S.rest.endsAt ? restLeft() : 'ready');
  }, 1000);
  var lock = null;
  function wake() { if (navigator.wakeLock && !S.finished && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {}); }
  document.addEventListener('visibilitychange', wake);
  applyTheme(); render(); wake();
})();

</script>
</body>
</html>
